name: Coleta

# 09:00 e 21:00 UTC = 6h e 18h no horário de Brasília.
# O cron do GitHub não conhece fuso: se o Brasil voltar a ter horário de verão,
# estes dois horários precisam ser corrigidos à mão.
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consultar os tribunais
        run: node --max-old-space-size=4096 coleta/executar.mjs

      - name: Conferir a resposta das fontes
        run: node coleta/conferir-fontes.mjs

      - name: Publicar o que mudou
        run: |
          git config user.name  'Coleta automática'
          git config user.email 'actions@github.com'
          git add dados site/dados.json
          if git diff --staged --quiet; then
            echo 'Nenhuma alteração nas fontes.'
          else
            git commit -m "Coleta de $(TZ=America/Sao_Paulo date '+%d/%m/%Y às %Hh%M')"
            git push
          fi
