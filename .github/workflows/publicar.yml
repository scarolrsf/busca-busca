name: Publicar

# Publica a pasta site/ no GitHub Pages a cada alteração no repositório —
# inclusive nas que a própria coleta grava, às 6h e às 18h.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é descartada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se há dado a publicar
        run: |
          test -s site/index.html || { echo 'site/index.html ausente'; exit 1; }
          test -s site/dados.json || { echo 'site/dados.json ausente'; exit 1; }

      # O Pages precisa estar habilitado uma vez em Settings → Pages, com a
      # origem "GitHub Actions". Habilitar por aqui não é possível: o token do
      # workflow não tem permissão para criar o site. Enquanto não estiver
      # habilitado, este passo falha — e falhar encheria a caixa de entrada de
      # aviso a cada coleta —, então a falha é tolerada e o restante é pulado.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages ainda indisponível
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::O GitHub Pages ainda não está disponível para este repositório."
          echo "::notice::Habilite em Settings → Pages, origem GitHub Actions. A publicação é retomada sozinha na alteração seguinte."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: publicacao
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
