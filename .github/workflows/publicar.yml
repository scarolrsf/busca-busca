name: Publicar

# Publica a pasta site/ no GitHub Pages a cada alteração no repositório —
# inclusive nas que a própria coleta grava, às 6h e às 18h.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é descartada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se há dado a publicar
        run: |
          test -s site/index.html || { echo 'site/index.html ausente'; exit 1; }
          test -s site/dados.json || { echo 'site/dados.json ausente'; exit 1; }

      # No plano gratuito, o Pages só existe para repositório público. Enquanto
      # não existir, este passo falha — e falhar aqui encheria a caixa de entrada
      # de aviso de erro a cada coleta. Então ele avisa e o restante é pulado.
      # Com `enablement`, assim que o repositório virar público o Pages é
      # habilitado por esta própria execução, sem precisar mexer em Settings.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages ainda indisponível
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::O GitHub Pages ainda não está disponível para este repositório."
          echo "::notice::No plano gratuito ele exige repositório público. A publicação será retomada sozinha na próxima alteração depois disso."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: publicacao
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
